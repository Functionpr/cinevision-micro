apiVersion: v1
kind: ConfigMap
metadata:
  name: cinevision-config
data:
  # PostgreSQL (RDS)
  POSTGRES_HOST: "cinevision-staging-postgres.cqty8224w3j4.us-east-1.rds.amazonaws.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cinevision"
  POSTGRES_JDBC_PARAMS: "?sslmode=require"
  
  # DocumentDB
  MONGO_HOST: "cinevision-staging-docdb.cluster-cqty8224w3j4.us-east-1.docdb.amazonaws.com"
  MONGO_PORT: "27017"
  MONGO_DATABASE: "cinevision"
  MONGO_AUTH_SOURCE: "user"
  MONGO_OPTIONS: "&tls=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
  
  # Redis (ElastiCache)
  REDIS_HOST: "cinevision-staging-redis.cqty8224w3j4.ng.0001.use1.cache.amazonaws.com"
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_SSL_ENABLED: "true"
  
  # Kafka (MSK)
  KAFKA_BOOTSTRAP_SERVERS: "b-1.cinevision-staging-msk.cqty8224w3j4.kafka.us-east-1.amazonaws.com:9092,b-2.cinevision-staging-msk.cqty8224w3j4.kafka.us-east-1.amazonaws.com:9092,b-3.cinevision-staging-msk.cqty8224w3j4.kafka.us-east-1.amazonaws.com:9092"
  KAFKA_SECURITY_PROTOCOL: "SSL"
  SPRING_KAFKA_SECURITY_PROTOCOL: "SSL"
  
  # Email Service
  MAIL_HOST: "email.staging.cinevision.com"
  MAIL_PORT: "587"
  CINEVISION_EMAIL_PROVIDER: "aws-ses"
  
  # AWS Configuration
  AWS_REGION: "us-east-1"
  AWS_SES_REGION: "us-east-1"
  AWS_S3_BUCKET: "cinevision-staging-assets"
  
  # Application Configuration
  ENVIRONMENT: "staging"
  LOG_LEVEL: "INFO"
  EUREKA_SERVER_URL: "http://eureka-server:8761/eureka"
