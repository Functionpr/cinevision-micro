apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: cinevision-dev
spec:
  selector:
    app: mailhog
  ports:
  - name: http
    port: 8025
    targetPort: 8025
  - name: smtp
    port: 1025
    targetPort: 1025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: cinevision-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
      - name: mailhog
        image: mailhog/mailhog:latest
        ports:
        - containerPort: 8025
        - containerPort: 1025
        readinessProbe:
          httpGet:
            path: /api/v2/messages
            port: 8025
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v2/messages
            port: 8025
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
