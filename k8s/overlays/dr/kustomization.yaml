apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cinevision-prod-dr
resources:
  - ../../base
  - ingress.yaml
  - docdb-admin-externalsecret.yaml
  - docdb-user-repair-job.yaml
images:
  - name: api-gateway
    newName: 211026994790.dkr.ecr.us-west-2.amazonaws.com/cinevision/api-gateway
    newTag: dr-latest
  - name: user-service
    newName: 211026994790.dkr.ecr.us-west-2.amazonaws.com/cinevision/user-service
    newTag: dr-latest
  - name: movie-service
    newName: 211026994790.dkr.ecr.us-west-2.amazonaws.com/cinevision/movie-service
    newTag: dr-latest
  - name: email-service
    newName: 211026994790.dkr.ecr.us-west-2.amazonaws.com/cinevision/email-service
    newTag: dr-latest
  - name: eureka-server
    newName: 211026994790.dkr.ecr.us-west-2.amazonaws.com/cinevision/eureka-server
    newTag: dr-latest
replicas:
  - name: api-gateway
    count: 1
  - name: user-service
    count: 1
  - name: movie-service
    count: 1
  - name: email-service
    count: 1
  - name: eureka-server
    count: 1
patches:
  - path: namespace-label-patch.yaml
  - path: configmap-patch.yaml
  - path: externalsecret-patch.yaml
  - target:
      group: external-secrets.io
      version: v1
      kind: ClusterSecretStore
      name: cinevision-secret-store
    patch: |-
      - op: replace
        path: /spec/provider/aws/auth/jwt/serviceAccountRef/namespace
        value: cinevision-prod-dr
  - target:
      group: external-secrets.io
      version: v1
      kind: ClusterSecretStore
      name: cinevision-secret-store
    patch: |-
      - op: replace
        path: /spec/provider/aws/region
        value: us-west-2
